<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Cascading Reader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #reader {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            gap: 12px;
            padding: 20px 0 100px 0;
        }

        .manga-page {
            width: 100%;
            height: auto;
            display: block;
            background-color: #1a1a1a;
            min-height: 500px;
            /* Marcador de posición */
        }

        .chapter-divider {
            text-align: center;
            padding: 20px;
            background: #1e88e5;
            font-weight: bold;
            margin: 20px 0;
            border-radius: 4px;
        }

        #global-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #333;
            pointer-events: none;
            z-index: 1000;
        }

        .loading-indicator {
            text-align: center;
            color: #aaa;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div id="reader">
        <!-- Las páginas e indicadores de capítulos se inyectarán aquí -->
    </div>

    <div id="global-status">Iniciando...</div>

    <script>
        const BASE_URL = 'http://192.168.0.21:2022';
        const MANGA_UID = 79962;

        let currentEpisode = 1; // Empezamos en el episodio 1
        let isLoading = false;

        const reader = document.getElementById('reader');
        const status = document.getElementById('global-status');

        // Configuración del observador para detectar la penúltima página
        const observerOptions = {
            root: null, // Usa el viewport del navegador
            rootMargin: '0px 0px 300px 0px', // Empieza a cargar 300px antes de que entre en pantalla
            threshold: 0.1
        };

        const pageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                // Si la penúltima página es visible y no estamos cargando ya un capítulo
                if (entry.isIntersecting && !isLoading) {
                    // Dejamos de observar este elemento para que no se dispare repetidamente
                    observer.unobserve(entry.target);

                    // Avanzamos al siguiente episodio
                    currentEpisode++;
                    loadNextEpisode(currentEpisode);
                }
            });
        }, observerOptions);

        async function loadNextEpisode(episodeNum) {
            isLoading = true;
            status.innerText = `Cargando Episodio ${episodeNum}...`;

            // Creamos un indicador visual en la cascada
            const loadingText = document.createElement('div');
            loadingText.className = 'loading-indicator';
            loadingText.innerText = `Buscando episodio ${episodeNum}...`;
            reader.appendChild(loadingText);

            try {
                // 1. Petición inicial para obtener el token/url del nuevo episodio
                const playResponse = await fetch(`${BASE_URL}/api/play`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: "manga",
                        uid: MANGA_UID,
                        ep: String(episodeNum), // Enviamos "1", "2", "3", etc.
                        m: "auto"
                    })
                });

                if (!playResponse.ok) throw new Error(`No se pudo obtener el ep ${episodeNum}`);
                const playData = await playResponse.json();

                // 2. Segunda petición para obtener las URLs finales de las imágenes WebP
                const mediaResponse = await fetch(`${BASE_URL}${playData.url}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!mediaResponse.ok) throw new Error(`Error al mapear imágenes del ep ${episodeNum}`);
                const images = await mediaResponse.json();

                // Removemos el texto temporal de "Buscando..."
                loadingText.remove();

                if (images && images.length > 0) {
                    // Añadimos un banner separador de capítulo
                    const divider = document.createElement('div');
                    divider.className = 'chapter-divider';
                    divider.innerText = `Episodio ${episodeNum}`;
                    reader.appendChild(divider);

                    // Renderizamos las imágenes del nuevo capítulo
                    images.forEach((url, index) => {
                        const img = document.createElement('img');
                        img.src = url;
                        img.alt = `Ep ${episodeNum} - Pág ${index + 1}`;
                        img.className = 'manga-page';
                        img.loading = 'lazy'; // Mantiene la optimización de memoria

                        reader.appendChild(img);

                        // TRUCO: Si es la PENÚLTIMA página del capítulo, la ponemos bajo observación
                        if (index === images.length - 2) {
                            pageObserver.observe(img);
                        }
                    });

                    status.innerText = `Viendo Episodio ${episodeNum}`;
                } else {
                    status.innerText = "Fin del contenido disponible.";
                }

            } catch (error) {
                console.error(error);
                loadingText.innerText = `Error cargando episodio ${episodeNum}: ${error.message}`;
                status.innerText = "Error de conexión.";
                // Si falla, permitimos que el usuario lo intente de nuevo al hacer scroll más abajo
                currentEpisode--;
            } finally {
                isLoading = false;
            }
        }

        // Carga automática del primer capítulo al abrir la página
        loadNextEpisode(currentEpisode);
    </script>
</body>

</html>
